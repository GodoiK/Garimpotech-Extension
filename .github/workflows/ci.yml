name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run lint:syntax
      - run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
      - run: npm test
